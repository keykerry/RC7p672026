  { text: "Questions 186-190", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 186-190", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên quan đến" },
  { text: "the following notice, e-mail, and schedule.", type: "np", grammarName: "Cụm danh từ", viTranslation: "thông báo, email và lịch trình sau." },

  { text: "Attention:", type: "np", grammarName: "Cụm danh từ", viTranslation: "Lưu ý:", breakLine: true },
  { text: "Oxton Science Museum Visitors", type: "np", grammarName: "Cụm danh từ", viTranslation: "Quý khách tham quan Bảo tàng Khoa học Oxton" },

  { text: "The Gartner Wing of the museum", type: "np", grammarName: "Cụm danh từ", viTranslation: "Khu Gartner của bảo tàng", breakLine: true },
  { text: "is currently closed.", type: "vp", grammarName: "Cụm động từ", viTranslation: "hiện đang đóng cửa." },

  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "apologize", type: "vp", grammarName: "Cụm động từ", viTranslation: "xin lỗi" },
  { text: "for the inconvenience.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vì sự bất tiện này." },

  { text: "Please be patient", type: "vp", grammarName: "Cụm động từ", viTranslation: "Xin hãy kiên nhẫn", breakLine: true },
  { text: "as", type: "other", grammarName: "Liên từ", viTranslation: "trong lúc" },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "prepare", type: "vp", grammarName: "Cụm động từ", viTranslation: "chuẩn bị" },
  { text: "the space", type: "np", grammarName: "Cụm danh từ", viTranslation: "không gian" },
  { text: "for our next exhibit,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho triển lãm tiếp theo," },
  { text: "The Power of Light.", type: "np", grammarName: "Cụm danh từ", viTranslation: "Sức mạnh của Ánh sáng." },

  { text: "Designed", type: "vp", grammarName: "Cụm động từ", viTranslation: "Được thiết kế", breakLine: true },
  { text: "by curator (người phụ trách) Sachiko Morishita,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "bởi người phụ trách Sachiko Morishita," },
  { text: "it", type: "np", grammarName: "Đại từ", viTranslation: "triển lãm" },
  { text: "explores (khám phá)", type: "vp", grammarName: "Cụm động từ", viTranslation: "khám phá" },
  { text: "innovations", type: "np", grammarName: "Cụm danh từ", viTranslation: "những đổi mới" },
  { text: "that will affect", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ ảnh hưởng đến" },
  { text: "the future,", type: "np", grammarName: "Cụm danh từ", viTranslation: "tương lai," },
  { text: "particularly", type: "adjp", grammarName: "Trạng từ", viTranslation: "đặc biệt" },
  { text: "in the world of lasers and optics (quang học).", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong thế giới laser và quang học." },

  { text: "The exhibit", type: "np", grammarName: "Cụm danh từ", viTranslation: "Triển lãm", breakLine: true },
  { text: "will be open", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ mở cửa" },
  { text: "to members and private group tours", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho hội viên và các đoàn tham quan riêng" },
  { text: "starting August 15", type: "pp", grammarName: "Cụm giới từ", viTranslation: "từ ngày 15 tháng 8" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "to the general public", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho công chúng" },
  { text: "starting September 2.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "từ ngày 2 tháng 9." },

  { text: "Good morning, team,", type: "other", grammarName: "Lời chào", viTranslation: "Chào buổi sáng cả nhóm,", breakLine: true },

  { text: "Interns (thực tập sinh) and their mentors (người hướng dẫn)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Thực tập sinh và người hướng dẫn của họ", breakLine: true },
  { text: "are invited to take", type: "vp", grammarName: "Cụm động từ", viTranslation: "được mời tham gia" },
  { text: "a trip (chuyến đi)", type: "np", grammarName: "Cụm danh từ", viTranslation: "một chuyến đi" },
  { text: "to the Oxton Science Museum", type: "pp", grammarName: "Cụm giới từ", viTranslation: "đến Bảo tàng Khoa học Oxton" },
  { text: "on Friday, August 19.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào thứ Sáu, ngày 19 tháng 8." },

  { text: "Many of you", type: "np", grammarName: "Đại từ", viTranslation: "Nhiều bạn", breakLine: true },
  { text: "have been", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã tham gia" },
  { text: "on previous Renmark Solutions trips,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "các chuyến đi trước của Renmark Solutions," },
  { text: "so", type: "other", grammarName: "Liên từ", viTranslation: "nên" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "các bạn" },
  { text: "know", type: "vp", grammarName: "Cụm động từ", viTranslation: "biết" },
  { text: "they", type: "np", grammarName: "Đại từ", viTranslation: "chúng" },
  { text: "are always", type: "vp", grammarName: "Cụm động từ", viTranslation: "luôn" },
  { text: "educational and exciting (thú vị).", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "mang tính giáo dục và thú vị." },

  { text: "Participants", type: "np", grammarName: "Cụm danh từ", viTranslation: "Người tham gia", breakLine: true },
  { text: "will get", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ được xem" },
  { text: "a look", type: "np", grammarName: "Cụm danh từ", viTranslation: "một cái nhìn" },
  { text: "at the science and technology", type: "pp", grammarName: "Cụm giới từ", viTranslation: "về khoa học và công nghệ" },
  { text: "that drives (thúc đẩy)", type: "vp", grammarName: "Cụm động từ", viTranslation: "thúc đẩy" },
  { text: "our company and customers.", type: "np", grammarName: "Cụm danh từ", viTranslation: "công ty và khách hàng của chúng ta." },

  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng ta", breakLine: true },
  { text: "will see", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ xem" },
  { text: "The Power of Light exhibit", type: "np", grammarName: "Cụm danh từ", viTranslation: "triển lãm Sức mạnh của Ánh sáng" },
  { text: "as part of our group tour.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong chuyến tham quan theo đoàn của chúng ta." },

  { text: "Vouchers", type: "np", grammarName: "Cụm danh từ", viTranslation: "Phiếu ăn", breakLine: true },
  { text: "will be handed out (phân phát)", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ được phát" },
  { text: "for lunch", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho bữa trưa" },
  { text: "at the museum's restaurant.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại nhà hàng của bảo tàng." },

  { text: "Our schedule", type: "np", grammarName: "Cụm danh từ", viTranslation: "Lịch trình của chúng ta", breakLine: true },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "như" },
  { text: "as follows.", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "sau." },

  // ===== Questions 191-195 =====
  { text: "Questions 191-195", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 191-195", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên quan đến" },
  { text: "the following advertisement, price list, and review.", type: "np", grammarName: "Cụm danh từ", viTranslation: "quảng cáo, bảng giá và bài đánh giá sau." },

  { text: "Protecto Umbrella (ô) Wrapping (quấn) Machines", type: "np", grammarName: "Cụm danh từ", viTranslation: "Máy bọc ô Protecto", breakLine: true },

  { text: "Visitors", type: "np", grammarName: "Cụm danh từ", viTranslation: "Khách", breakLine: true },
  { text: "entering and walking through", type: "vp", grammarName: "Cụm động từ", viTranslation: "bước vào và đi qua" },
  { text: "a building", type: "np", grammarName: "Cụm danh từ", viTranslation: "một tòa nhà" },
  { text: "with wet umbrellas", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với ô ướt" },
  { text: "unintentionally create", type: "vp", grammarName: "Cụm động từ", viTranslation: "vô tình tạo ra" },
  { text: "wet and slippery (trơn) floors.", type: "np", grammarName: "Cụm danh từ", viTranslation: "sàn nhà ướt và trơn trượt." },

  { text: "The Protecto Umbrella Wrapping machine (PUW machine)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Máy bọc ô Protecto (máy PUW)", breakLine: true },
  { text: "provides", type: "vp", grammarName: "Cụm động từ", viTranslation: "mang đến" },
  { text: "a simple and convenient way", type: "np", grammarName: "Cụm danh từ", viTranslation: "một cách đơn giản và tiện lợi" },
  { text: "to address (giải quyết)", type: "vp", grammarName: "Cụm động từ", viTranslation: "để giải quyết" },
  { text: "this problem.", type: "np", grammarName: "Cụm danh từ", viTranslation: "vấn đề này." },

  { text: "The machine", type: "np", grammarName: "Cụm danh từ", viTranslation: "Máy", breakLine: true },
  { text: "is best placed", type: "vp", grammarName: "Cụm động từ", viTranslation: "nên đặt tốt nhất" },
  { text: "in the entryway of your building.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở lối vào của tòa nhà bạn." },

  { text: "Upon entry,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Khi bước vào,", breakLine: true },
  { text: "visitors", type: "np", grammarName: "Cụm danh từ", viTranslation: "khách" },
  { text: "insert", type: "vp", grammarName: "Cụm động từ", viTranslation: "cho" },
  { text: "their wet (ướt) umbrellas", type: "np", grammarName: "Cụm danh từ", viTranslation: "chiếc ô ướt của họ" },
  { text: "into the machine.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào máy." },

  { text: "It", type: "np", grammarName: "Đại từ", viTranslation: "Máy", breakLine: true },
  { text: "automatically wraps", type: "vp", grammarName: "Cụm động từ", viTranslation: "tự động bọc" },
  { text: "the umbrella", type: "np", grammarName: "Cụm danh từ", viTranslation: "chiếc ô" },
  { text: "in a clear (trong suốt) plastic bag,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong một túi nhựa trong suốt," },
  { text: "after which", type: "other", grammarName: "Liên từ", viTranslation: "sau đó" },
  { text: "visitors", type: "np", grammarName: "Cụm danh từ", viTranslation: "khách" },
  { text: "can take", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể lấy" },
  { text: "their umbrellas.", type: "np", grammarName: "Cụm danh từ", viTranslation: "ô của mình." },

  { text: "Upon leaving,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Khi ra về,", breakLine: true },
  { text: "they", type: "np", grammarName: "Đại từ", viTranslation: "họ" },
  { text: "can discard (vứt)", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể vứt" },
  { text: "the used bags", type: "np", grammarName: "Cụm danh từ", viTranslation: "những túi đã dùng" },
  { text: "in any nearby trash can.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào bất kỳ thùng rác nào gần đó." },

  { text: "PUW machines", type: "np", grammarName: "Cụm danh từ", viTranslation: "Máy PUW", breakLine: true },
  { text: "are available", type: "vp", grammarName: "Cụm động từ", viTranslation: "có sẵn" },
  { text: "with one or two umbrella-wrapping devices", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với một hoặc hai thiết bị bọc ô" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "come", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "in stainless (không gỉ) steel or black.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "bằng thép không gỉ hoặc màu đen." },

  { text: "The machine", type: "np", grammarName: "Cụm danh từ", viTranslation: "Máy", breakLine: true },
  { text: "wraps", type: "vp", grammarName: "Cụm động từ", viTranslation: "bọc" },
  { text: "umbrellas", type: "np", grammarName: "Cụm danh từ", viTranslation: "ô" },
  { text: "in 1.5 seconds.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong 1,5 giây." },

  { text: "The stand", type: "np", grammarName: "Cụm danh từ", viTranslation: "Giá đỡ", breakLine: true },
  { text: "is mobile (di động)", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "có thể di chuyển" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "thus (do đó)", type: "adjp", grammarName: "Trạng từ", viTranslation: "do đó" },
  { text: "can be rolled (lăn)", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể được lăn" },
  { text: "around to different locations.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "đến nhiều vị trí khác nhau." },

  { text: "Purchase", type: "vp", grammarName: "Cụm động từ", viTranslation: "Hãy mua", breakLine: true },
  { text: "a PUW machine", type: "np", grammarName: "Cụm danh từ", viTranslation: "một máy PUW" },
  { text: "throughout November", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong suốt tháng 11" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "receive", type: "vp", grammarName: "Cụm động từ", viTranslation: "nhận" },
  { text: "a lightweight (nhẹ) umbrella", type: "np", grammarName: "Cụm danh từ", viTranslation: "một chiếc ô nhẹ" },
  { text: "featuring (bao gồm)", type: "vp", grammarName: "Cụm động từ", viTranslation: "có in" },
  { text: "our company logo.", type: "np", grammarName: "Cụm danh từ", viTranslation: "logo công ty chúng tôi." },

  { text: "Office Equipment Review:", type: "np", grammarName: "Cụm danh từ", viTranslation: "Đánh giá thiết bị văn phòng:", breakLine: true },
  { text: "Protecto Umbrella Wrapping Machines", type: "np", grammarName: "Cụm danh từ", viTranslation: "Máy bọc ô Protecto" },

  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "love", type: "vp", grammarName: "Cụm động từ", viTranslation: "rất thích" },
  { text: "our new PUW machine!", type: "np", grammarName: "Cụm danh từ", viTranslation: "chiếc máy PUW mới của chúng tôi!" },

  { text: "As the facilities manager of a medium-sized office building,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Là quản lý cơ sở vật chất của một tòa nhà văn phòng cỡ vừa,", breakLine: true },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "often have to deal with", type: "vp", grammarName: "Cụm động từ", viTranslation: "thường phải đối phó với" },
  { text: "the inconvenience (bất tiện) of wet floors", type: "np", grammarName: "Cụm danh từ", viTranslation: "sự bất tiện của sàn ướt" },
  { text: "caused by", type: "vp", grammarName: "Cụm động từ", viTranslation: "do" },
  { text: "visitors", type: "np", grammarName: "Cụm danh từ", viTranslation: "khách" },
  { text: "entering with umbrellas.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "mang ô vào gây ra." },

  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "used to have", type: "vp", grammarName: "Cụm động từ", viTranslation: "từng có" },
  { text: "a large umbrella stand (giá đỡ)", type: "np", grammarName: "Cụm danh từ", viTranslation: "một giá để ô lớn" },
  { text: "in the lobby", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở sảnh" },
  { text: "where visitors could leave", type: "vp", grammarName: "Cụm động từ", viTranslation: "nơi khách có thể để" },
  { text: "umbrellas,", type: "np", grammarName: "Cụm danh từ", viTranslation: "ô," },
  { text: "but", type: "other", grammarName: "Liên từ", viTranslation: "nhưng" },
  { text: "only a few people", type: "np", grammarName: "Cụm danh từ", viTranslation: "chỉ vài người" },
  { text: "used it.", type: "vp", grammarName: "Cụm động từ", viTranslation: "dùng nó." },

  { text: "Then", type: "adjp", grammarName: "Trạng từ", viTranslation: "Sau đó", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "tried", type: "vp", grammarName: "Cụm động từ", viTranslation: "thử" },
  { text: "an umbrella stand", type: "np", grammarName: "Cụm danh từ", viTranslation: "một giá để ô" },
  { text: "that included", type: "vp", grammarName: "Cụm động từ", viTranslation: "có kèm" },
  { text: "disposable (dùng 1 lần) plastic bags", type: "np", grammarName: "Cụm danh từ", viTranslation: "túi nhựa dùng một lần" },
  { text: "that visitors could tear off (xé)", type: "vp", grammarName: "Cụm động từ", viTranslation: "mà khách có thể xé ra" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "put", type: "vp", grammarName: "Cụm động từ", viTranslation: "bỏ" },
  { text: "their umbrellas", type: "np", grammarName: "Cụm danh từ", viTranslation: "ô của họ" },
  { text: "in.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào." },

  { text: "However,", type: "other", grammarName: "Liên từ", viTranslation: "Tuy nhiên,", breakLine: true },
  { text: "this method", type: "np", grammarName: "Cụm danh từ", viTranslation: "cách này" },
  { text: "was ineffective", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "không hiệu quả" },
  { text: "because", type: "other", grammarName: "Liên từ", viTranslation: "vì" },
  { text: "the bags", type: "np", grammarName: "Cụm danh từ", viTranslation: "những chiếc túi" },
  { text: "were rather (khá là) flimsy (mỏng),", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "khá mỏng manh," },
  { text: "thus (do đó) failing to prevent", type: "vp", grammarName: "Cụm động từ", viTranslation: "do đó không ngăn được" },
  { text: "water leakage (rò rỉ).", type: "np", grammarName: "Cụm danh từ", viTranslation: "nước rò rỉ." },

  { text: "So,", type: "other", grammarName: "Liên từ", viTranslation: "Vì vậy,", breakLine: true },
  { text: "in November,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào tháng 11," },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "decided to try", type: "vp", grammarName: "Cụm động từ", viTranslation: "quyết định thử" },
  { text: "a PUW machine.", type: "np", grammarName: "Cụm danh từ", viTranslation: "một máy PUW." },

  { text: "Because", type: "other", grammarName: "Liên từ", viTranslation: "Vì", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "have", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "many visitors,", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhiều khách," },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "purchased", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã mua" },
  { text: "the PUW machine with two devices (thiết bị)", type: "np", grammarName: "Cụm danh từ", viTranslation: "máy PUW có hai thiết bị" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "ordered", type: "vp", grammarName: "Cụm động từ", viTranslation: "đặt" },
  { text: "it", type: "np", grammarName: "Đại từ", viTranslation: "nó" },
  { text: "in stainless steel (thép)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "bằng thép không gỉ" },
  { text: "to match", type: "vp", grammarName: "Cụm động từ", viTranslation: "để hợp với" },

function renderParsedData(parsedItems) {
    const container = document.getElementById('resultContent');
    container.innerHTML = '';

    document.getElementById('phraseCount').innerText = `${parsedItems.length} cụm từ`;

    parsedItems.forEach((item, index) => {
        // Nếu phần tử được đánh dấu breakLine hoặc là phần tử đầu tiên, tạo thẻ xuống dòng (div mới)
        if (item.breakLine || index === 0) {
            const lineBreak = document.createElement('div');
            // Tạo khoảng cách giữa các dòng cho thoáng mắt
            lineBreak.className = index === 0 ? 'w-full mb-2' : 'w-full mt-4 mb-2 pt-2';
            container.appendChild(lineBreak);
        }

        const tag = document.createElement('span');
        
        // Gán class phân loại màu sắc bình thường dựa vào type (np, vp, pp, adjp, other)
        tag.className = `phrase-tag phrase-${item.type}`;
        tag.setAttribute('data-type', item.type);
        tag.setAttribute('data-index', index);

        const formattedContent = formatBracketText(item.text);

        tag.innerHTML = `
            ${formattedContent}
            <span class="tooltip bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg shadow-xl font-normal border border-slate-700">
                <span class="text-orange-400 font-semibold">${item.viTranslation || item.text}</span>
                <span class="text-slate-400 block text-[10px] mt-0.5">${item.grammarName}</span>
            </span>
        `;

        tag.addEventListener('mouseenter', () => updateDetailCard(item));
        tag.addEventListener('click', () => updateDetailCard(item));

        container.appendChild(tag);
    });
}
        function updateDetailCard(item) {
            document.getElementById('cardTranslation').innerText = `"${item.text.trim()}" ➔ ${item.viTranslation || 'N/A'}`;
            document.getElementById('cardGrammarType').innerText = item.grammarName;
        }

        function formatBracketText(text) {
            return text.replace(/(\b[\w']+\b)\s*(\([\s\S]*?\))/g, '<b class="bold-before-bracket">$1</b><span class="bracket-note">$2</span>');
        }

        function filterType(type) {
            const tags = document.querySelectorAll('.phrase-tag');
            const buttons = document.querySelectorAll('.legend-btn');

            buttons.forEach(btn => btn.classList.remove('active', 'bg-slate-800', 'text-white'));
            event.currentTarget.classList.add('active', 'bg-slate-800', 'text-white');

            tags.forEach(tag => {
                if (type === 'all') {
                    tag.classList.remove('active-filter');
                    tag.style.opacity = '1';
                } else if (tag.getAttribute('data-type') === type) {
                    tag.classList.add('active-filter');
                    tag.style.opacity = '1';
                } else {
                    tag.classList.remove('active-filter');
                    tag.style.opacity = '0.25';
                }
            });
        }
    </script>
</body>
</html>
