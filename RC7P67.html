    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Base style for parsed phrase chips */
        .phrase-tag {
            display: inline-block;
            padding: 2px 6px;
            margin: 2px 1px;
            border-radius: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
            border-bottom: 2px transparent solid;
            line-height: 1.8rem;
        }

        /* Pastel Highlight colors on hover or active filter */
        .phrase-vp:hover, .phrase-vp.active-filter {
            background-color: #ffedd5 !important;
            color: #9a3412;
            border-bottom-color: #f97316;
            box-shadow: 0 2px 8px rgba(249, 115, 22, 0.15);
        }

        .phrase-np:hover, .phrase-np.active-filter {
            background-color: #dbeafe !important;
            color: #1e40af;
            border-bottom-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.15);
        }

        .phrase-pp:hover, .phrase-pp.active-filter {
            background-color: #dcfce7 !important;
            color: #166534;
            border-bottom-color: #22c55e;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.15);
        }

        .phrase-adjp:hover, .phrase-adjp.active-filter {
            background-color: #fef3c7 !important;
            color: #92400e;
            border-bottom-color: #eab308;
            box-shadow: 0 2px 8px rgba(234, 179, 8, 0.15);
        }

        .phrase-other:hover, .phrase-other.active-filter {
            background-color: #f3e8ff !important;
            color: #6b21a8;
            border-bottom-color: #a855f7;
            box-shadow: 0 2px 8px rgba(168, 85, 247, 0.15);
        }

        /* Hover Tooltip design */
        .phrase-tag .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .phrase-tag:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Note formatting in brackets */
        .bracket-note {
            color: #64748b;
            font-weight: 400;
            font-size: 0.9em;
            margin-left: 2px;
            margin-right: 2px;
        }

        /* Bold emphasis for words immediately preceding brackets */
        .bold-before-bracket {
            font-weight: 700 !important;
            color: #0f172a;
        }
    </style>

  { text: "throughout the area.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "khắp khu vực." },

  { text: "142-----.", type: "other", grammarName: "Chỗ trống", viTranslation: "(chỗ trống 142)", breakLine: true },

  { text: "Several inexpensive (rẻ) campsites (khu cắm trại) and youth hostels (ký túc xá thanh niên)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Một số khu cắm trại và nhà nghỉ thanh niên giá rẻ", breakLine: true },
  { text: "are available", type: "vp", grammarName: "Cụm động từ", viTranslation: "có sẵn" },
  { text: "throughout the year.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "quanh năm." },

  { text: "For a detailed listing", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Để xem danh sách chi tiết", breakLine: true },
  { text: "of vacation (nghỉ dưỡng) properties (bất động sản) and hotels", type: "pp", grammarName: "Cụm giới từ", viTranslation: "về các cơ sở nghỉ dưỡng và khách sạn" },
  { text: "on the peninsula (bán đảo),", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trên bán đảo," },
  { text: "see", type: "vp", grammarName: "Cụm động từ", viTranslation: "hãy xem" },
  { text: "the back cover (bìa sau)", type: "np", grammarName: "Cụm danh từ", viTranslation: "bìa sau" },
  { text: "of this brochure (sách qcao).", type: "pp", grammarName: "Cụm giới từ", viTranslation: "của tờ rơi này." },

  { text: "an alert (cảnh báo)", type: "np", grammarName: "Cụm danh từ", viTranslation: "một thông báo" },
  { text: "that", type: "other", grammarName: "Liên từ", viTranslation: "rằng" },
  { text: "all necessary signatures", type: "np", grammarName: "Cụm danh từ", viTranslation: "tất cả chữ ký cần thiết" },
  { text: "on the contract", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trên hợp đồng" },
  { text: "have been acquired (được thu thập).", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã được thu thập đủ." },

  { text: "Upon 144-----,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Khi (144)-----,", breakLine: true },
  { text: "all signers", type: "np", grammarName: "Cụm danh từ", viTranslation: "tất cả người ký" },
  { text: "may access (truy cập)", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể truy cập" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "save", type: "vp", grammarName: "Cụm động từ", viTranslation: "lưu" },
  { text: "the document.", type: "np", grammarName: "Cụm danh từ", viTranslation: "tài liệu." },

  { text: "If", type: "other", grammarName: "Liên từ", viTranslation: "Nếu", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bạn" },
  { text: "have", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "a Nelsign account,", type: "np", grammarName: "Cụm danh từ", viTranslation: "tài khoản Nelsign," },
  { text: "this contract and any other documents", type: "np", grammarName: "Cụm danh từ", viTranslation: "hợp đồng này và mọi tài liệu khác" },
  { text: "you have previously signed", type: "vp", grammarName: "Cụm động từ", viTranslation: "bạn đã ký trước đây" },
  { text: "electronically (điện tử)", type: "adjp", grammarName: "Trạng từ", viTranslation: "bằng điện tử" },
  { text: "with Nelsign", type: "pp", grammarName: "Cụm giới từ", viTranslation: "qua Nelsign" },
  { text: "will be saved", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ được lưu" },
  { text: "in your profile.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong hồ sơ của bạn." },

  { text: "145-----.", type: "other", grammarName: "Chỗ trống", viTranslation: "(chỗ trống 145)", breakLine: true },

  { text: "For any questions", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Với bất kỳ thắc mắc nào", breakLine: true },
  { text: "146-----", type: "other", grammarName: "Chỗ trống", viTranslation: "(146)-----" },
  { text: "the signing process (quy trình),", type: "np", grammarName: "Cụm danh từ", viTranslation: "quy trình ký," },
  { text: "contact", type: "vp", grammarName: "Cụm động từ", viTranslation: "hãy liên hệ" },
  { text: "our customer support center", type: "np", grammarName: "Cụm danh từ", viTranslation: "trung tâm hỗ trợ khách hàng của chúng tôi" },
  { text: "at inquiries@nelsign.com.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "qua inquiries@nelsign.com." },

  { text: "Questions 147-148", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 147-148", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên quan đến" },
  { text: "the following coupon.", type: "np", grammarName: "Cụm danh từ", viTranslation: "phiếu giảm giá sau." },

  { text: "COUPON", type: "np", grammarName: "Cụm danh từ", viTranslation: "PHIẾU GIẢM GIÁ", breakLine: true },

  { text: "If", type: "other", grammarName: "Liên từ", viTranslation: "Nếu", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bạn" },
  { text: "love", type: "vp", grammarName: "Cụm động từ", viTranslation: "yêu thích" },
  { text: "the delicious cheese and crackers", type: "np", grammarName: "Cụm danh từ", viTranslation: "phô mai và bánh quy giòn ngon" },
  { text: "served", type: "vp", grammarName: "Cụm động từ", viTranslation: "được phục vụ" },
  { text: "at Truli Cafés,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại Truli Cafés," },

  { text: "at home!", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại nhà!" },

  { text: "Truli crackers and cheese", type: "np", grammarName: "Cụm danh từ", viTranslation: "Bánh quy giòn và phô mai Truli", breakLine: true },
  { text: "are now available", type: "vp", grammarName: "Cụm động từ", viTranslation: "hiện đã có bán" },
  { text: "at major supermarkets (siêu thị).", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại các siêu thị lớn." },

  { text: "Save", type: "vp", grammarName: "Cụm động từ", viTranslation: "Tiết kiệm", breakLine: true },
  { text: "$2.00", type: "np", grammarName: "Cụm danh từ", viTranslation: "2 đô la" },
  { text: "on the purchase of ONE box of Truli crackers (any size)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "khi mua MỘT hộp bánh quy giòn Truli (mọi kích cỡ)" },
  { text: "when", type: "other", grammarName: "Liên từ", viTranslation: "khi" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bạn" },
  { text: "buy", type: "vp", grammarName: "Cụm động từ", viTranslation: "mua" },
  { text: "any TWO packages of Truli cheese.", type: "np", grammarName: "Cụm danh từ", viTranslation: "bất kỳ HAI gói phô mai Truli nào." },

  { text: "Limit one coupon", type: "vp", grammarName: "Cụm động từ", viTranslation: "Giới hạn một phiếu", breakLine: true },
  { text: "per customer.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho mỗi khách hàng." },

  { text: "This coupon", type: "np", grammarName: "Cụm danh từ", viTranslation: "Phiếu này", breakLine: true },
  { text: "may not be combined (kết hợp)", type: "vp", grammarName: "Cụm động từ", viTranslation: "không được kết hợp" },
  { text: "with other special offers.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với các ưu đãi đặc biệt khác." },

  { text: "Expires July 31.", type: "vp", grammarName: "Cụm động từ", viTranslation: "Hết hạn ngày 31 tháng 7.", breakLine: true },

  // ===== Questions 149-150 =====
  { text: "Questions 149-150", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 149-150", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên quan đến" },
  { text: "the following text message.", type: "np", grammarName: "Cụm danh từ", viTranslation: "tin nhắn sau." },

  { text: "Brice's Ice Creamery", type: "np", grammarName: "Cụm danh từ", viTranslation: "Tiệm kem Brice's", breakLine: true },
  { text: "June 29, 2:02 PM.", type: "np", grammarName: "Cụm danh từ", viTranslation: "29 tháng 6, 2:02 chiều.", breakLine: true },

  { text: "Thank you,", type: "vp", grammarName: "Cụm động từ", viTranslation: "Cảm ơn", breakLine: true },
  { text: "Nathan Thielen,", type: "np", grammarName: "Cụm danh từ", viTranslation: "Nathan Thielen," },
  { text: "for joining", type: "vp", grammarName: "Cụm động từ", viTranslation: "vì đã tham gia" },
  { text: "Brice's Ice Creamery's rewards program.", type: "np", grammarName: "Cụm danh từ", viTranslation: "chương trình tích điểm của tiệm kem Brice's." },

  { text: "You", type: "np", grammarName: "Đại từ", viTranslation: "Bạn", breakLine: true },
  { text: "have earned", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã nhận được" },
  { text: "your first points (điểm)", type: "np", grammarName: "Cụm danh từ", viTranslation: "những điểm đầu tiên" },
  { text: "just by signing up (đăng ký)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "chỉ nhờ đăng ký" },
  { text: "for our program.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "chương trình của chúng tôi." },

  { text: "For every $1.00", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Với mỗi 1 đô la", breakLine: true },
  { text: "you spend", type: "vp", grammarName: "Cụm động từ", viTranslation: "bạn chi tiêu" },
  { text: "in one of our ice cream shops,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại một trong các tiệm kem của chúng tôi," },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bạn" },
  { text: "earn", type: "vp", grammarName: "Cụm động từ", viTranslation: "nhận" },
  { text: "1 point.", type: "np", grammarName: "Cụm danh từ", viTranslation: "1 điểm." },

  { text: "Every 100 points", type: "np", grammarName: "Cụm danh từ", viTranslation: "Mỗi 100 điểm", breakLine: true },
  { text: "you earn", type: "vp", grammarName: "Cụm động từ", viTranslation: "bạn tích lũy" },
  { text: "can be redeemed (đổi)", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể được đổi" },
  { text: "for $5.00 off", type: "pp", grammarName: "Cụm giới từ", viTranslation: "lấy mức giảm 5 đô la" },
  { text: "your purchase of ice cream or store merchandise (hàng hóa),", type: "pp", grammarName: "Cụm giới từ", viTranslation: "khi bạn mua kem hoặc hàng hóa của cửa hàng," },
  { text: "including", type: "vp", grammarName: "Cụm động từ", viTranslation: "bao gồm" },
  { text: "T-shirts and tote bags.", type: "np", grammarName: "Cụm danh từ", viTranslation: "áo thun và túi tote." },

  { text: "You", type: "np", grammarName: "Đại từ", viTranslation: "Bạn", breakLine: true },
  { text: "are even entitled (cấp quyền)", type: "vp", grammarName: "Cụm động từ", viTranslation: "thậm chí còn được hưởng" },
  { text: "to a free scoop (muỗng)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "một muỗng kem miễn phí" },
  { text: "at any Brice's Ice Creamery", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại bất kỳ tiệm kem Brice's nào" },
  { text: "on your birthday.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào ngày sinh nhật." },

  { text: "You have earned:", type: "vp", grammarName: "Cụm động từ", viTranslation: "Bạn đã tích lũy được:", breakLine: true },
  { text: "20 points.", type: "np", grammarName: "Cụm danh từ", viTranslation: "20 điểm." },

  { text: "You", type: "np", grammarName: "Đại từ", viTranslation: "Bạn", breakLine: true },
  { text: "are", type: "vp", grammarName: "Cụm động từ", viTranslation: "còn cách" },
  { text: "80 points away", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "80 điểm" },
  { text: "from earning", type: "vp", grammarName: "Cụm động từ", viTranslation: "để nhận được" },
  { text: "your next reward.", type: "np", grammarName: "Cụm danh từ", viTranslation: "phần thưởng tiếp theo." },

  // ===== Questions 151-152 =====
  { text: "Questions 151-152", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 151-152", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên quan đến" },
  { text: "the following e-mail.", type: "np", grammarName: "Cụm danh từ", viTranslation: "email sau." },

  { text: "Dear Mr. Tran,", type: "np", grammarName: "Cụm danh từ", viTranslation: "Kính gửi ông Tran,", breakLine: true },

  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "am contacting", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên hệ với" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "ông" },
  { text: "because", type: "other", grammarName: "Liên từ", viTranslation: "vì" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "ông" },
  { text: "did not appear (xuất hiện)", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã không có mặt" },
  { text: "for your 1:00 p.m appointment", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho cuộc hẹn lúc 1 giờ chiều" },
  { text: "for your annual physical exam (buổi khám sức khỏe)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "khám sức khỏe định kỳ hằng năm" },
  { text: "at Hopper's Medical Center (HMC)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại Trung tâm Y tế Hopper's (HMC)" },
  { text: "today.", type: "adjp", grammarName: "Trạng từ", viTranslation: "hôm nay." },

  { text: "As you know,", type: "vp", grammarName: "Cụm động từ", viTranslation: "Như ông đã biết,", breakLine: true },
  { text: "it", type: "np", grammarName: "Đại từ", viTranslation: "việc" },
  { text: "is our policy (chính sách)", type: "np", grammarName: "Cụm danh từ", viTranslation: "là chính sách của chúng tôi" },
  { text: "to charge (tính phí)", type: "vp", grammarName: "Cụm động từ", viTranslation: "tính" },
  { text: "the full appointment fee", type: "np", grammarName: "Cụm danh từ", viTranslation: "toàn bộ phí hẹn khám" },
  { text: "for missed appointments", type: "pp", grammarName: "Cụm giới từ", viTranslation: "đối với các cuộc hẹn bị lỡ" },
  { text: "unless", type: "other", grammarName: "Liên từ", viTranslation: "trừ khi" },
  { text: "the patient (bệnh nhân)", type: "np", grammarName: "Cụm danh từ", viTranslation: "bệnh nhân" },
  { text: "notifies", type: "vp", grammarName: "Cụm động từ", viTranslation: "thông báo cho" },
  { text: "us", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "at least 24 hours in advance of (trước)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ít nhất 24 giờ trước" },
  { text: "the scheduled visit.", type: "np", grammarName: "Cụm danh từ", viTranslation: "buổi khám đã hẹn." },

  { text: "However,", type: "other", grammarName: "Liên từ", viTranslation: "Tuy nhiên,", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "are waiving (loại bỏ)", type: "vp", grammarName: "Cụm động từ", viTranslation: "miễn" },
  { text: "the fee", type: "np", grammarName: "Cụm danh từ", viTranslation: "khoản phí" },
  { text: "because", type: "other", grammarName: "Liên từ", viTranslation: "vì" },
  { text: "this", type: "np", grammarName: "Đại từ", viTranslation: "đây" },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "your first missed appointment", type: "np", grammarName: "Cụm danh từ", viTranslation: "lần lỡ hẹn đầu tiên của ông" },
  { text: "in fifteen years", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong mười lăm năm" },
  { text: "of being a patient", type: "pp", grammarName: "Cụm giới từ", viTranslation: "làm bệnh nhân" },
  { text: "at the center.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại trung tâm." },

  { text: "Please contact", type: "vp", grammarName: "Cụm động từ", viTranslation: "Vui lòng liên hệ", breakLine: true },

  // ===== Questions 155-157 =====
  { text: "Questions 155-157", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 155-157", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên quan đến" },
  { text: "the following Web page.", type: "np", grammarName: "Cụm danh từ", viTranslation: "trang web sau." },

  { text: "https://www.qualitekkresearch.com/aboutus", type: "np", grammarName: "Cụm danh từ", viTranslation: "https://www.qualitekkresearch.com/aboutus", breakLine: true },

  { text: "Home", type: "np", grammarName: "Cụm danh từ", viTranslation: "Trang chủ", breakLine: true },
  { text: "About Us", type: "np", grammarName: "Cụm danh từ", viTranslation: "Về chúng tôi", breakLine: true },
  { text: "Register", type: "vp", grammarName: "Cụm động từ", viTranslation: "Đăng ký", breakLine: true },
  { text: "Testimonials", type: "np", grammarName: "Cụm danh từ", viTranslation: "Lời chứng thực", breakLine: true },

  { text: "Thousands (hàng nghìn) of large companies", type: "np", grammarName: "Cụm danh từ", viTranslation: "Hàng nghìn công ty lớn", breakLine: true },
  { text: "use", type: "vp", grammarName: "Cụm động từ", viTranslation: "sử dụng" },
  { text: "surveys (khảo sát)", type: "np", grammarName: "Cụm danh từ", viTranslation: "các cuộc khảo sát" },
  { text: "to measure (đo lường)", type: "vp", grammarName: "Cụm động từ", viTranslation: "để đo lường" },
  { text: "customer satisfaction (hài lòng)", type: "np", grammarName: "Cụm danh từ", viTranslation: "mức độ hài lòng của khách hàng" },
  { text: "with the goal of improving", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với mục tiêu cải thiện" },
  { text: "their business.", type: "np", grammarName: "Cụm danh từ", viTranslation: "hoạt động kinh doanh của họ." },

  { text: "Qualitekk Research", type: "np", grammarName: "Cụm danh từ", viTranslation: "Qualitekk Research", breakLine: true },
  { text: "serves", type: "vp", grammarName: "Cụm động từ", viTranslation: "phục vụ" },
  { text: "its client companies", type: "np", grammarName: "Cụm danh từ", viTranslation: "các công ty khách hàng của mình" },
  { text: "by analyzing", type: "vp", grammarName: "Cụm động từ", viTranslation: "bằng cách phân tích" },
  { text: "survey results", type: "np", grammarName: "Cụm danh từ", viTranslation: "kết quả khảo sát" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "producing", type: "vp", grammarName: "Cụm động từ", viTranslation: "lập" },
  { text: "detailed reports (báo cáo)", type: "np", grammarName: "Cụm danh từ", viTranslation: "các báo cáo chi tiết" },
  { text: "containing (chứa)", type: "vp", grammarName: "Cụm động từ", viTranslation: "chứa" },
  { text: "insights", type: "np", grammarName: "Cụm danh từ", viTranslation: "những hiểu biết sâu sắc" },
  { text: "about customers' preferences (sở thích).", type: "pp", grammarName: "Cụm giới từ", viTranslation: "về sở thích của khách hàng." },

  { text: "— [1] —.", type: "other", grammarName: "Vị trí chèn câu", viTranslation: "(vị trí [1])", breakLine: true },

  { text: "Over twelve years of operation,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Qua mười hai năm hoạt động,", breakLine: true },
  { text: "Qualitekk Research", type: "np", grammarName: "Cụm danh từ", viTranslation: "Qualitekk Research" },
  { text: "has built", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã xây dựng" },
  { text: "a strong reputation (danh tiếng)", type: "np", grammarName: "Cụm danh từ", viTranslation: "danh tiếng vững chắc" },
  { text: "for providing", type: "vp", grammarName: "Cụm động từ", viTranslation: "về việc cung cấp" },
  { text: "valuable data.", type: "np", grammarName: "Cụm danh từ", viTranslation: "dữ liệu có giá trị." },

  { text: "Every day,", type: "adjp", grammarName: "Trạng từ", viTranslation: "Mỗi ngày,", breakLine: true },
  { text: "consumers", type: "np", grammarName: "Cụm danh từ", viTranslation: "người tiêu dùng" },
  { text: "complete", type: "vp", grammarName: "Cụm động từ", viTranslation: "hoàn thành" },
  { text: "more than 20,000 online surveys", type: "np", grammarName: "Cụm danh từ", viTranslation: "hơn 20.000 khảo sát trực tuyến" },
  { text: "that provide", type: "vp", grammarName: "Cụm động từ", viTranslation: "cung cấp" },
  { text: "feedback", type: "np", grammarName: "Cụm danh từ", viTranslation: "phản hồi" },
  { text: "on hundreds (hàng trăm) of different products.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "về hàng trăm sản phẩm khác nhau." },

  { text: "— [2] —.", type: "other", grammarName: "Vị trí chèn câu", viTranslation: "(vị trí [2])", breakLine: true },

  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "connect", type: "vp", grammarName: "Cụm động từ", viTranslation: "kết nối" },
  { text: "consumers (người tiêu thụ)", type: "np", grammarName: "Cụm danh từ", viTranslation: "người tiêu dùng" },
  { text: "with surveys", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với các khảo sát" },
  { text: "about products", type: "pp", grammarName: "Cụm giới từ", viTranslation: "về các sản phẩm" },
  { text: "that may interest", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể khiến" },
  { text: "them.", type: "np", grammarName: "Đại từ", viTranslation: "họ quan tâm." },

  { text: "Participants (người tham gia)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Người tham gia", breakLine: true },
  { text: "who submit", type: "vp", grammarName: "Cụm động từ", viTranslation: "nộp" },
  { text: "a survey", type: "np", grammarName: "Cụm danh từ", viTranslation: "một khảo sát" },
  { text: "that we facilitate (hỗ trợ)", type: "vp", grammarName: "Cụm động từ", viTranslation: "do chúng tôi hỗ trợ" },
  { text: "will earn", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ nhận được" },
  { text: "reward points (điểm thưởng)", type: "np", grammarName: "Cụm danh từ", viTranslation: "điểm thưởng" },
  { text: "from us.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "từ chúng tôi." },

  { text: "After as few as (ít nhất) five surveys,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Chỉ sau ít nhất năm khảo sát,", breakLine: true },
  { text: "points", type: "np", grammarName: "Cụm danh từ", viTranslation: "điểm" },
  { text: "can be redeemed (đổi)", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể được đổi" },
  { text: "for a gift card", type: "pp", grammarName: "Cụm giới từ", viTranslation: "lấy thẻ quà tặng" },
  { text: "usable (có thể dùng)", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "có thể sử dụng" },
  { text: "at many stores.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại nhiều cửa hàng." },

  { text: "— [3] —.", type: "other", grammarName: "Vị trí chèn câu", viTranslation: "(vị trí [3])", breakLine: true },

  { text: "If", type: "other", grammarName: "Liên từ", viTranslation: "Nếu", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bạn" },
  { text: "would like to join,", type: "vp", grammarName: "Cụm động từ", viTranslation: "muốn tham gia," },
  { text: "visit", type: "vp", grammarName: "Cụm động từ", viTranslation: "hãy truy cập" },
  { text: "our Register page", type: "np", grammarName: "Cụm danh từ", viTranslation: "trang Đăng ký của chúng tôi" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "complete", type: "vp", grammarName: "Cụm động từ", viTranslation: "hoàn thành" },
  { text: "the member profile questionnaire (bảng câu hỏi).", type: "np", grammarName: "Cụm danh từ", viTranslation: "bảng câu hỏi hồ sơ thành viên." },

  { text: "This information", type: "np", grammarName: "Cụm danh từ", viTranslation: "Thông tin này", breakLine: true },
  { text: "will help", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ giúp" },
  { text: "us", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "identify (xác định)", type: "vp", grammarName: "Cụm động từ", viTranslation: "xác định" },
  { text: "surveys", type: "np", grammarName: "Cụm danh từ", viTranslation: "các khảo sát" },
  { text: "that match", type: "vp", grammarName: "Cụm động từ", viTranslation: "phù hợp với" },
  { text: "your interests.", type: "np", grammarName: "Cụm danh từ", viTranslation: "sở thích của bạn." },

  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "will then (sau đó) send", type: "vp", grammarName: "Cụm động từ", viTranslation: "sau đó sẽ gửi" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "cho bạn" },
  { text: "links", type: "np", grammarName: "Cụm danh từ", viTranslation: "các liên kết" },
  { text: "to those surveys", type: "pp", grammarName: "Cụm giới từ", viTranslation: "đến những khảo sát đó" },
  { text: "to complete", type: "vp", grammarName: "Cụm động từ", viTranslation: "để hoàn thành" },
  { text: "at your leisure (thời gian rảnh).", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào lúc rảnh của bạn." },

  { text: "If", type: "other", grammarName: "Liên từ", viTranslation: "Nếu", breakLine: true },
  { text: "your interests", type: "np", grammarName: "Cụm danh từ", viTranslation: "sở thích của bạn" },
  { text: "change,", type: "vp", grammarName: "Cụm động từ", viTranslation: "thay đổi," },
  { text: "simply update (cập nhật)", type: "vp", grammarName: "Cụm động từ", viTranslation: "chỉ cần cập nhật" },
  { text: "your profile.", type: "np", grammarName: "Cụm danh từ", viTranslation: "hồ sơ của bạn." },

  { text: "— [4] —.", type: "other", grammarName: "Vị trí chèn câu", viTranslation: "(vị trí [4])", breakLine: true },

  { text: "All responses", type: "np", grammarName: "Cụm danh từ", viTranslation: "Mọi câu trả lời", breakLine: true },
  { text: "in Qualitekk Research surveys", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong các khảo sát của Qualitekk Research" },
  { text: "are confidential (bí mật),", type: "vp", grammarName: "Cụm động từ", viTranslation: "đều được bảo mật," },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bạn" },
  { text: "will never be personally identified", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ không bao giờ bị nhận dạng cá nhân" },
  { text: "with survey data.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "gắn với dữ liệu khảo sát." },

  // ===== Questions 158-160 =====
  { text: "Questions 158-160", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 158-160", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên quan đến" },
  { text: "the following memo.", type: "np", grammarName: "Cụm danh từ", viTranslation: "bản ghi nhớ sau." },

  { text: "MEMO", type: "np", grammarName: "Cụm danh từ", viTranslation: "BẢN GHI NHỚ", breakLine: true },
  { text: "To: Swansea Spotlight Theatre staff", type: "np", grammarName: "Cụm danh từ", viTranslation: "Gửi: Nhân viên Nhà hát Swansea Spotlight", breakLine: true },
  { text: "From: Rhian Grifud, Chief Executive", type: "np", grammarName: "Cụm danh từ", viTranslation: "Từ: Rhian Grifud, Tổng giám đốc", breakLine: true },
  { text: "Date: 7 September", type: "np", grammarName: "Cụm danh từ", viTranslation: "Ngày: 7 tháng 9", breakLine: true },
  { text: "Subject: What's happening", type: "np", grammarName: "Cụm danh từ", viTranslation: "Chủ đề: Có gì mới", breakLine: true },

  { text: "Dear Staff:", type: "np", grammarName: "Cụm danh từ", viTranslation: "Gửi các nhân viên:", breakLine: true },

  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "am thrilled (cảm động)", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "rất xúc động" },
  { text: "about the imminent (sắp tới) reopening", type: "pp", grammarName: "Cụm giới từ", viTranslation: "về việc nhà hát sắp mở cửa trở lại" },
  { text: "of our theatre (nhà hát),", type: "pp", grammarName: "Cụm giới từ", viTranslation: "của chúng ta," },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "hope", type: "vp", grammarName: "Cụm động từ", viTranslation: "hy vọng" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "các bạn" },
  { text: "are too.", type: "adjp", grammarName: "Trạng từ", viTranslation: "cũng vậy." },

  { text: "It", type: "np", grammarName: "Đại từ", viTranslation: "Đó", breakLine: true },
  { text: "has been", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã là" },
  { text: "a long process (quá trình),", type: "np", grammarName: "Cụm danh từ", viTranslation: "một quá trình dài," },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "audiences (khán giả)", type: "np", grammarName: "Cụm danh từ", viTranslation: "khán giả" },
  { text: "will undoubtedly (không nghi ngờ) appreciate (đánh giá cao)", type: "vp", grammarName: "Cụm động từ", viTranslation: "chắc chắn sẽ đánh giá cao" },
  { text: "all the renovations,", type: "np", grammarName: "Cụm danh từ", viTranslation: "tất cả các hạng mục cải tạo," },
  { text: "including", type: "vp", grammarName: "Cụm động từ", viTranslation: "bao gồm" },
  { text: "the newly upholstered (bọc) seats", type: "np", grammarName: "Cụm danh từ", viTranslation: "những chiếc ghế mới được bọc lại" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "the updated heating (sưởi) and air-conditioning (điều hòa) system.", type: "np", grammarName: "Cụm danh từ", viTranslation: "hệ thống sưởi và điều hòa được nâng cấp." },

  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "believe", type: "vp", grammarName: "Cụm động từ", viTranslation: "tin rằng" },
  { text: "that", type: "other", grammarName: "Liên từ", viTranslation: "rằng" },
  { text: "all of us", type: "np", grammarName: "Đại từ", viTranslation: "tất cả chúng ta" },
  { text: "who work", type: "vp", grammarName: "Cụm động từ", viTranslation: "làm việc" },
  { text: "in the theatre", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở nhà hát" },
  { text: "will enjoy", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ thích" },
  { text: "the changes", type: "np", grammarName: "Cụm danh từ", viTranslation: "những thay đổi" },
  { text: "as well.", type: "adjp", grammarName: "Trạng từ", viTranslation: "này nữa." },

  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "know", type: "vp", grammarName: "Cụm động từ", viTranslation: "biết" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "các bạn" },
  { text: "must be eager (háo hức)", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "hẳn rất háo hức" },
  { text: "to rehearse (tập dượt)", type: "vp", grammarName: "Cụm động từ", viTranslation: "để tập dượt" },
  { text: "in the newly refurbished (cải tạo) building", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong tòa nhà mới được cải tạo" },
  { text: "next week.", type: "adjp", grammarName: "Trạng từ", viTranslation: "vào tuần tới." },

  { text: "One of the more visible (dễ thấy) updates", type: "np", grammarName: "Cụm danh từ", viTranslation: "Một trong những cập nhật dễ thấy hơn cả", breakLine: true },
  { text: "to the space", type: "pp", grammarName: "Cụm giới từ", viTranslation: "của không gian" },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "the Swansea Spotlight Bistro,", type: "np", grammarName: "Cụm danh từ", viTranslation: "quán Swansea Spotlight Bistro," },
  { text: "a new restaurant", type: "np", grammarName: "Cụm danh từ", viTranslation: "một nhà hàng mới" },
  { text: "with a large seating area", type: "pp", grammarName: "Cụm giới từ", viTranslation: "có khu ngồi rộng" },
  { text: "that replaces (thay thế)", type: "vp", grammarName: "Cụm động từ", viTranslation: "thay thế cho" },
  { text: "our previous concession stand (quầy giảm giá).", type: "np", grammarName: "Cụm danh từ", viTranslation: "quầy bán đồ ăn nhẹ trước đây của chúng ta." },

  { text: "The bistro", type: "np", grammarName: "Cụm danh từ", viTranslation: "Quán", breakLine: true },
  { text: "faces (hướng ra)", type: "vp", grammarName: "Cụm động từ", viTranslation: "hướng ra" },
  { text: "the street", type: "np", grammarName: "Cụm danh từ", viTranslation: "đường phố" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "will be open", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ mở cửa" },
  { text: "to the public", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho công chúng" },
  { text: "even when", type: "other", grammarName: "Liên từ", viTranslation: "ngay cả khi" },
  { text: "no performances", type: "np", grammarName: "Cụm danh từ", viTranslation: "không có buổi biểu diễn nào" },
  { text: "are scheduled.", type: "vp", grammarName: "Cụm động từ", viTranslation: "được lên lịch." },

  { text: "The menu", type: "np", grammarName: "Cụm danh từ", viTranslation: "Thực đơn", breakLine: true },
  { text: "will feature (bao gồm)", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ có" },
  { text: "a wide selection of beverages, snacks, and meals,", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhiều lựa chọn đồ uống, đồ ăn nhẹ và bữa ăn," },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "it", type: "np", grammarName: "Đại từ", viTranslation: "thực đơn" },
  { text: "will change", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ thay đổi" },
  { text: "with the seasons (mùa)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "theo mùa" },
  { text: "to highlight (làm nổi bật)", type: "vp", grammarName: "Cụm động từ", viTranslation: "để làm nổi bật" },
  { text: "locally available products.", type: "np", grammarName: "Cụm danh từ", viTranslation: "các sản phẩm có sẵn tại địa phương." },

  { text: "On 2 October,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Vào ngày 2 tháng 10,", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng ta" },
  { text: "will celebrate", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ chào mừng" },
  { text: "the theatre's grand reopening", type: "np", grammarName: "Cụm danh từ", viTranslation: "lễ mở cửa trở lại của nhà hát" },
  { text: "with a one-night musical showcase", type: "pp", grammarName: "Cụm giới từ", viTranslation: "bằng một đêm trình diễn âm nhạc" },
  { text: "starring (đóng chính)", type: "vp", grammarName: "Cụm động từ", viTranslation: "với sự tham gia của" },
  { text: "some of the best actors (diễn viên) and singers", type: "np", grammarName: "Cụm danh từ", viTranslation: "một số diễn viên và ca sĩ xuất sắc nhất" },
  { text: "in Wales.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "xứ Wales." },

  { text: "One week later,", type: "adjp", grammarName: "Trạng từ", viTranslation: "Một tuần sau,", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng ta" },
  { text: "will begin", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ bắt đầu" },
  { text: "the run of Blake's River.", type: "np", grammarName: "Cụm danh từ", viTranslation: "đợt công diễn vở Blake's River." },

  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "appreciate (đánh giá cao)", type: "vp", grammarName: "Cụm động từ", viTranslation: "trân trọng" },
  { text: "all your hard work and patience (sự kiên nhẫn)", type: "np", grammarName: "Cụm danh từ", viTranslation: "mọi nỗ lực và sự kiên nhẫn của các bạn" },
  { text: "as", type: "other", grammarName: "Liên từ", viTranslation: "khi" },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng ta" },
  { text: "start", type: "vp", grammarName: "Cụm động từ", viTranslation: "bắt đầu" },
  { text: "this new chapter", type: "np", grammarName: "Cụm danh từ", viTranslation: "chương mới này" },
  { text: "in the history of Swansea Spotlight Theatre,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong lịch sử Nhà hát Swansea Spotlight," },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "look forward to", type: "vp", grammarName: "Cụm động từ", viTranslation: "mong chờ" },
  { text: "our exciting future together.", type: "np", grammarName: "Cụm danh từ", viTranslation: "tương lai đầy hứng khởi cùng nhau của chúng ta." },

  // ===== Questions 161-163 =====
  { text: "Questions 161-163", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 161-163", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên quan đến" },
  { text: "the following company Web page.", type: "np", grammarName: "Cụm danh từ", viTranslation: "trang web công ty sau." },

  { text: "Join", type: "vp", grammarName: "Cụm động từ", viTranslation: "Hãy tham gia", breakLine: true },
  { text: "the Building Blocks Team", type: "np", grammarName: "Cụm danh từ", viTranslation: "Nhóm Building Blocks" },

  { text: "Building Blocks", type: "np", grammarName: "Cụm danh từ", viTranslation: "Building Blocks", breakLine: true },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "the newest employee-led volunteer group", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhóm tình nguyện do nhân viên dẫn dắt mới nhất" },
  { text: "at Milos Tek Corporation.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại Tập đoàn Milos Tek." },

  { text: "Unlike (không giống như)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Không giống như", breakLine: true },
  { text: "other company groups", type: "np", grammarName: "Cụm danh từ", viTranslation: "các nhóm khác của công ty" },
  { text: "that organize", type: "vp", grammarName: "Cụm động từ", viTranslation: "tổ chức" },
  { text: "charity (từ thiện) fund-raisers (gây quỹ)", type: "np", grammarName: "Cụm danh từ", viTranslation: "các buổi gây quỹ từ thiện" },
  { text: "or", type: "other", grammarName: "Liên từ", viTranslation: "hoặc" },
  { text: "clean up", type: "vp", grammarName: "Cụm động từ", viTranslation: "dọn dẹp" },
  { text: "local parks,", type: "np", grammarName: "Cụm danh từ", viTranslation: "các công viên địa phương," },
  { text: "Building Blocks", type: "np", grammarName: "Cụm danh từ", viTranslation: "Building Blocks" },
  { text: "asks", type: "vp", grammarName: "Cụm động từ", viTranslation: "đề nghị" },
  { text: "its members", type: "np", grammarName: "Cụm danh từ", viTranslation: "các thành viên" },
  { text: "to share", type: "vp", grammarName: "Cụm động từ", viTranslation: "chia sẻ" },
  { text: "their professional expertise (chuyên môn)", type: "np", grammarName: "Cụm danh từ", viTranslation: "chuyên môn nghề nghiệp của họ" },
  { text: "with others.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với người khác." },

  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "offer", type: "vp", grammarName: "Cụm động từ", viTranslation: "cung cấp" },
  { text: "free seminars (hội thảo)", type: "np", grammarName: "Cụm danh từ", viTranslation: "các buổi hội thảo miễn phí" },
  { text: "on management, public relations (quan hệ), grant writing (viết đơn xin tài trợ), and various types of application software", type: "pp", grammarName: "Cụm giới từ", viTranslation: "về quản lý, quan hệ công chúng, viết đơn xin tài trợ và nhiều loại phần mềm ứng dụng" },
  { text: "to nonprofit (phi lợi nhuận) organizations", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho các tổ chức phi lợi nhuận" },
  { text: "in Lalortown.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở Lalortown." },

  { text: "These organizations", type: "np", grammarName: "Cụm danh từ", viTranslation: "Các tổ chức này", breakLine: true },
  { text: "include", type: "vp", grammarName: "Cụm động từ", viTranslation: "bao gồm" },
  { text: "youth clubs, community (cộng đồng) sports leagues (giải đấu), the Lalortown Nature Center, and Lalortown's public radio station (đài phát thanh)!", type: "np", grammarName: "Cụm danh từ", viTranslation: "các câu lạc bộ thanh thiếu niên, giải thể thao cộng đồng, Trung tâm Thiên nhiên Lalortown và cả đài phát thanh công cộng của Lalortown!" },

  { text: "Participation", type: "np", grammarName: "Cụm danh từ", viTranslation: "Việc tham gia", breakLine: true },
  { text: "in Building Blocks", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào Building Blocks" },
  { text: "generally involves (liên quan)", type: "vp", grammarName: "Cụm động từ", viTranslation: "thường đòi hỏi" },
  { text: "more time", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhiều thời gian hơn" },
  { text: "than what is encouraged", type: "vp", grammarName: "Cụm động từ", viTranslation: "mức được khuyến khích" },
  { text: "by other volunteer groups at Milos Tek.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "bởi các nhóm tình nguyện khác tại Milos Tek." },

  { text: "While", type: "other", grammarName: "Liên từ", viTranslation: "Trong khi", breakLine: true },
  { text: "each seminar", type: "np", grammarName: "Cụm danh từ", viTranslation: "mỗi buổi hội thảo" },
  { text: "is typically (thường)", type: "vp", grammarName: "Cụm động từ", viTranslation: "thường" },
  { text: "one hour long,", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "dài một giờ," },
  { text: "planning and preparation (chuẩn bị)", type: "np", grammarName: "Cụm danh từ", viTranslation: "việc lên kế hoạch và chuẩn bị" },
  { text: "are also", type: "vp", grammarName: "Cụm động từ", viTranslation: "cũng là" },
  { text: "part of our activities (hoạt động).", type: "np", grammarName: "Cụm danh từ", viTranslation: "một phần hoạt động của chúng tôi." },

  { text: "Those", type: "np", grammarName: "Đại từ", viTranslation: "Những ai", breakLine: true },
  { text: "who choose to volunteer", type: "vp", grammarName: "Cụm động từ", viTranslation: "chọn làm tình nguyện" },
  { text: "with us", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cùng chúng tôi" },
  { text: "can expect to dedicate (dành ra)", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể dự kiến dành ra" },
  { text: "about two hours each week", type: "np", grammarName: "Cụm danh từ", viTranslation: "khoảng hai giờ mỗi tuần" },
  { text: "to our work.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho công việc của chúng tôi." },

  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "will hold", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ tổ chức" },
  { text: "a 30-minute information session", type: "np", grammarName: "Cụm danh từ", viTranslation: "một buổi giới thiệu thông tin dài 30 phút" },
  { text: "on Friday, May 3,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào thứ Sáu, ngày 3 tháng 5," },
  { text: "at 12:30 P.M.,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "lúc 12:30 trưa," },
  { text: "in conference room B-2.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại phòng họp B-2." },

  { text: "In the meantime,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Trong thời gian chờ đợi,", breakLine: true },
  { text: "if you have", type: "vp", grammarName: "Cụm động từ", viTranslation: "nếu bạn có" },
  { text: "questions,", type: "np", grammarName: "Cụm danh từ", viTranslation: "thắc mắc," },
  { text: "please contact", type: "vp", grammarName: "Cụm động từ", viTranslation: "vui lòng liên hệ" },
  { text: "Min-Gyu Byun", type: "np", grammarName: "Cụm danh từ", viTranslation: "Min-Gyu Byun" },
  { text: "at byun003@milostek.com.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "qua byun003@milostek.com." },

  // ===== Questions 164-167 =====
  { text: "Questions 164-167", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 164-167", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên quan đến" },
  { text: "the following article.", type: "np", grammarName: "Cụm danh từ", viTranslation: "bài báo sau." },

  { text: "Mehan Motors", type: "np", grammarName: "Cụm danh từ", viTranslation: "Mehan Motors", breakLine: true },
  { text: "Appoints", type: "vp", grammarName: "Cụm động từ", viTranslation: "bổ nhiệm" },
  { text: "New CEO", type: "np", grammarName: "Cụm danh từ", viTranslation: "CEO mới" },

  { text: "By Jonas Schulz", type: "np", grammarName: "Cụm danh từ", viTranslation: "Tác giả: Jonas Schulz", breakLine: true },

  { text: "DETROIT (January 2)—", type: "np", grammarName: "Cụm danh từ", viTranslation: "DETROIT (ngày 2 tháng 1)—", breakLine: true },
  { text: "This", type: "np", grammarName: "Đại từ", viTranslation: "Đây" },
  { text: "will be", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ là" },
  { text: "a year of firsts (những lần đầu)", type: "np", grammarName: "Cụm danh từ", viTranslation: "một năm của những lần đầu tiên" },
  { text: "at Mehan Motors.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại Mehan Motors." },

  { text: "For the first time", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Lần đầu tiên", breakLine: true },
  { text: "in its 35-year history,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong lịch sử 35 năm," },
  { text: "the company", type: "np", grammarName: "Cụm danh từ", viTranslation: "công ty" },
  { text: "is changing", type: "vp", grammarName: "Cụm động từ", viTranslation: "thay đổi" },
  { text: "its top leadership (lãnh đạo cấp cao);", type: "np", grammarName: "Cụm danh từ", viTranslation: "ban lãnh đạo cao nhất;" },
  { text: "Mehan", type: "np", grammarName: "Cụm danh từ", viTranslation: "Mehan" },
  { text: "will soon welcome", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ sớm chào đón" },
  { text: "the first American and the first woman", type: "np", grammarName: "Cụm danh từ", viTranslation: "người Mỹ đầu tiên và người phụ nữ đầu tiên" },
  { text: "to hold", type: "vp", grammarName: "Cụm động từ", viTranslation: "giữ" },
  { text: "the title (chức vụ) of CEO.", type: "np", grammarName: "Cụm danh từ", viTranslation: "chức danh CEO." },

  { text: "— [1] —.", type: "other", grammarName: "Vị trí chèn câu", viTranslation: "(vị trí [1])", breakLine: true },

  { text: "Dana Loeb", type: "np", grammarName: "Cụm danh từ", viTranslation: "Dana Loeb", breakLine: true },
  { text: "will begin", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ bắt đầu" },
  { text: "her tenure (nhiệm kỳ)", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhiệm kỳ của bà" },
  { text: "at Mehan Motors", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại Mehan Motors" },
  { text: "on February 1,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào ngày 1 tháng 2," },
  { text: "the company", type: "np", grammarName: "Cụm danh từ", viTranslation: "công ty" },
  { text: "announced", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã thông báo" },
  { text: "yesterday.", type: "adjp", grammarName: "Trạng từ", viTranslation: "hôm qua." },

  { text: "Ms. Loeb", type: "np", grammarName: "Cụm danh từ", viTranslation: "Bà Loeb", breakLine: true },
  { text: "graduated (tốt nghiệp)", type: "vp", grammarName: "Cụm động từ", viTranslation: "tốt nghiệp" },
  { text: "with top honors (danh dự)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "loại xuất sắc" },
  { text: "from Clover University of Technology in Boston,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại Đại học Công nghệ Clover ở Boston," },
  { text: "where", type: "other", grammarName: "Liên từ", viTranslation: "nơi" },
  { text: "she", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "completed", type: "vp", grammarName: "Cụm động từ", viTranslation: "hoàn thành" },
  { text: "a degree in electrical engineering (kỹ thuật).", type: "np", grammarName: "Cụm danh từ", viTranslation: "bằng kỹ sư điện." },

  { text: "— [2] —.", type: "other", grammarName: "Vị trí chèn câu", viTranslation: "(vị trí [2])", breakLine: true },

  { text: "She", type: "np", grammarName: "Đại từ", viTranslation: "Bà", breakLine: true },
  { text: "eventually (cuối cùng) rose", type: "vp", grammarName: "Cụm động từ", viTranslation: "cuối cùng đã thăng tiến" },
  { text: "to lead", type: "vp", grammarName: "Cụm động từ", viTranslation: "để lãnh đạo" },
  { text: "the electric vehicle (EV) division", type: "np", grammarName: "Cụm danh từ", viTranslation: "bộ phận xe điện (EV)" },
  { text: "at Tafts Motors in Detroit.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại Tafts Motors ở Detroit." },

  { text: "Within two years,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Trong vòng hai năm,", breakLine: true },
  { text: "the company", type: "np", grammarName: "Cụm danh từ", viTranslation: "công ty" },
  { text: "promoted (thăng chức)", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã thăng chức cho" },
  { text: "her", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "to the position of chief operating officer.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "lên vị trí giám đốc điều hành." },

  { text: "Ms. Loeb", type: "np", grammarName: "Cụm danh từ", viTranslation: "Bà Loeb", breakLine: true },
  { text: "eventually left", type: "vp", grammarName: "Cụm động từ", viTranslation: "cuối cùng đã rời" },
  { text: "her position at Tafts Motors", type: "np", grammarName: "Cụm danh từ", viTranslation: "vị trí của bà tại Tafts Motors" },
  { text: "to become", type: "vp", grammarName: "Cụm động từ", viTranslation: "để trở thành" },
  { text: "CEO of the British car company Norana,", type: "np", grammarName: "Cụm danh từ", viTranslation: "CEO của hãng xe Anh Norana," },

  { text: "in Jaxon Shore (bờ biển):", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở Jaxon Shore:" },
  { text: "the original Pelican Inlet store", type: "np", grammarName: "Cụm danh từ", viTranslation: "cửa hàng gốc Pelican Inlet" },
  { text: "and,", type: "other", grammarName: "Liên từ", viTranslation: "và," },
  { text: "opening in June,", type: "vp", grammarName: "Cụm động từ", viTranslation: "khai trương vào tháng 6," },
  { text: "our new Gravel Road location.", type: "np", grammarName: "Cụm danh từ", viTranslation: "cơ sở Gravel Road mới của chúng tôi." },

  { text: "All interviews", type: "np", grammarName: "Cụm danh từ", viTranslation: "Tất cả các buổi phỏng vấn", breakLine: true },
  { text: "will be conducted", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ được tiến hành" },
  { text: "at the Gravel Road store.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại cửa hàng Gravel Road." },

  { text: "Go to", type: "vp", grammarName: "Cụm động từ", viTranslation: "Hãy truy cập", breakLine: true },
  { text: "www.surfbirdbeachwear.com/jobs", type: "np", grammarName: "Cụm danh từ", viTranslation: "www.surfbirdbeachwear.com/jobs" },
  { text: "to apply.", type: "vp", grammarName: "Cụm động từ", viTranslation: "để ứng tuyển." },

  // ===== Questions 181-185 =====
  { text: "Questions 181-185", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 181-185", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "liên quan đến" },
  { text: "the following e-mail and blog post.", type: "np", grammarName: "Cụm danh từ", viTranslation: "email và bài đăng blog sau." },

  { text: "Dear Team:", type: "np", grammarName: "Cụm danh từ", viTranslation: "Gửi cả nhóm:", breakLine: true },

  { text: "In late December,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Vào cuối tháng 12,", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng ta" },
  { text: "will take possession (nhận)", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ nhận bàn giao" },
  { text: "of the first six of the twelve Trak-4 jets (máy bay)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "sáu chiếc đầu tiên trong số mười hai máy bay phản lực Trak-4" },
  { text: "we ordered", type: "vp", grammarName: "Cụm động từ", viTranslation: "chúng ta đã đặt" },
  { text: "last year.", type: "adjp", grammarName: "Trạng từ", viTranslation: "năm ngoái." },

  { text: "The remaining (còn lại) jets", type: "np", grammarName: "Cụm danh từ", viTranslation: "Các máy bay còn lại", breakLine: true },
  { text: "will be delivered", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ được giao" },
  { text: "throughout the coming year.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong suốt năm tới." },

  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "believe", type: "vp", grammarName: "Cụm động từ", viTranslation: "tin rằng" },
  { text: "these narrow-body jets", type: "np", grammarName: "Cụm danh từ", viTranslation: "những chiếc máy bay thân hẹp này" },
  { text: "represent", type: "vp", grammarName: "Cụm động từ", viTranslation: "đại diện cho" },
  { text: "the future of our airline.", type: "np", grammarName: "Cụm danh từ", viTranslation: "tương lai của hãng hàng không chúng ta." },

  { text: "In addition to (ngoài)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Ngoài việc", breakLine: true },
  { text: "being", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "the quietest (yên tĩnh) jets", type: "np", grammarName: "Cụm danh từ", viTranslation: "những máy bay êm nhất" },
  { text: "on the market today,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trên thị trường hiện nay," },
  { text: "they", type: "np", grammarName: "Đại từ", viTranslation: "chúng" },
  { text: "are", type: "vp", grammarName: "Cụm động từ", viTranslation: "còn" },
  { text: "20 percent more fuel efficient (tiết kiệm nhiên liệu)", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "tiết kiệm nhiên liệu hơn 20 phần trăm" },
  { text: "than the DB90s", type: "pp", grammarName: "Cụm giới từ", viTranslation: "so với các máy bay DB90" },
  { text: "that we currently fly.", type: "vp", grammarName: "Cụm động từ", viTranslation: "mà chúng ta hiện đang khai thác." },

  { text: "They", type: "np", grammarName: "Đại từ", viTranslation: "Chúng", breakLine: true },
  { text: "also have", type: "vp", grammarName: "Cụm động từ", viTranslation: "còn có" },
  { text: "a smaller passenger capacity (sức chứa) of 76 seats,", type: "np", grammarName: "Cụm danh từ", viTranslation: "sức chứa hành khách nhỏ hơn, 76 ghế," },
  { text: "making", type: "vp", grammarName: "Cụm động từ", viTranslation: "khiến" },
  { text: "them", type: "np", grammarName: "Đại từ", viTranslation: "chúng" },
  { text: "ideally (lý tưởng) suited", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "phù hợp lý tưởng" },
  { text: "to underserved (chưa phục vụ) regional markets.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với các thị trường khu vực chưa được phục vụ đầy đủ." },

  { text: "In anticipation (dự đoán) of", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Để chuẩn bị cho", breakLine: true },
  { text: "the upcoming delivery,", type: "np", grammarName: "Cụm danh từ", viTranslation: "đợt giao máy bay sắp tới," },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng ta" },
  { text: "must decide", type: "vp", grammarName: "Cụm động từ", viTranslation: "phải quyết định" },
  { text: "what routes (tuyến đường)", type: "np", grammarName: "Cụm danh từ", viTranslation: "những tuyến đường nào" },
  { text: "to fly", type: "vp", grammarName: "Cụm động từ", viTranslation: "để bay" },
  { text: "the new aircraft", type: "np", grammarName: "Cụm danh từ", viTranslation: "máy bay mới" },
  { text: "on.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trên đó." },

  { text: "Perhaps (có lẽ)", type: "adjp", grammarName: "Trạng từ", viTranslation: "Có lẽ", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng ta" },
  { text: "need to rethink", type: "vp", grammarName: "Cụm động từ", viTranslation: "cần suy nghĩ lại" },
  { text: "our entire hub (trung tâm) system.", type: "np", grammarName: "Cụm danh từ", viTranslation: "toàn bộ hệ thống trung tâm trung chuyển của chúng ta." },

  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng ta", breakLine: true },
  { text: "currently have", type: "vp", grammarName: "Cụm động từ", viTranslation: "hiện có" },
  { text: "seven regional urban (thành phố) hubs", type: "np", grammarName: "Cụm danh từ", viTranslation: "bảy trung tâm đô thị khu vực" },
  { text: "where", type: "other", grammarName: "Liên từ", viTranslation: "nơi" },
  { text: "our flights", type: "np", grammarName: "Cụm danh từ", viTranslation: "các chuyến bay của chúng ta" },
  { text: "connect.", type: "vp", grammarName: "Cụm động từ", viTranslation: "nối chuyến." },

  { text: "Passengers", type: "np", grammarName: "Cụm danh từ", viTranslation: "Hành khách", breakLine: true },
  { text: "flying", type: "vp", grammarName: "Cụm động từ", viTranslation: "bay" },
  { text: "between smaller cities", type: "pp", grammarName: "Cụm giới từ", viTranslation: "giữa các thành phố nhỏ hơn" },
  { text: "must change", type: "vp", grammarName: "Cụm động từ", viTranslation: "phải đổi" },
  { text: "planes (máy bay)", type: "np", grammarName: "Cụm danh từ", viTranslation: "máy bay" },
  { text: "at one of these hubs.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại một trong các trung tâm này." },

  { text: "Landing (hạ cánh) fees", type: "np", grammarName: "Cụm danh từ", viTranslation: "Phí hạ cánh", breakLine: true },
  { text: "at these larger airports", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại các sân bay lớn này" },
  { text: "tend to be", type: "vp", grammarName: "Cụm động từ", viTranslation: "thường" },
  { text: "very high.", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "rất cao." },

  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng ta", breakLine: true },
  { text: "could drastically (đáng kể) reduce", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể giảm đáng kể" },
  { text: "our operating expenses", type: "np", grammarName: "Cụm danh từ", viTranslation: "chi phí vận hành của mình" },
  { text: "by flying", type: "vp", grammarName: "Cụm động từ", viTranslation: "bằng cách khai thác" },
  { text: "narrow-body craft", type: "np", grammarName: "Cụm danh từ", viTranslation: "máy bay thân hẹp" },
  { text: "directly to and from airports", type: "pp", grammarName: "Cụm giới từ", viTranslation: "bay thẳng đến và đi từ các sân bay" },
  { text: "located away from", type: "vp", grammarName: "Cụm động từ", viTranslation: "nằm cách xa" },
  { text: "these major urban centers.", type: "np", grammarName: "Cụm danh từ", viTranslation: "các trung tâm đô thị lớn này." },

  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "am setting up", type: "vp", grammarName: "Cụm động từ", viTranslation: "đang sắp xếp" },
  { text: "a meeting", type: "np", grammarName: "Cụm danh từ", viTranslation: "một cuộc họp" },
  { text: "one week from today", type: "adjp", grammarName: "Trạng từ", viTranslation: "một tuần kể từ hôm nay" },
  { text: "to discuss", type: "vp", grammarName: "Cụm động từ", viTranslation: "để thảo luận" },
  { text: "this issue.", type: "np", grammarName: "Cụm danh từ", viTranslation: "vấn đề này." },

  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng ta", breakLine: true },
  { text: "will analyze", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ phân tích" },
  { text: "the profitability of each of our current routes", type: "np", grammarName: "Cụm danh từ", viTranslation: "khả năng sinh lời của từng tuyến bay hiện tại" },
  { text: "in order to reach", type: "vp", grammarName: "Cụm động từ", viTranslation: "để đưa ra" },
  { text: "an informed (sáng suốt) decision.", type: "np", grammarName: "Cụm danh từ", viTranslation: "một quyết định sáng suốt." },

  { text: "Kota Adachi", type: "np", grammarName: "Cụm danh từ", viTranslation: "Kota Adachi", breakLine: true },
  { text: "CEO, Ventana Airlines", type: "np", grammarName: "Cụm danh từ", viTranslation: "Giám đốc điều hành, Hãng hàng không Ventana", breakLine: true },

  { text: "Travelaider:", type: "np", grammarName: "Cụm danh từ", viTranslation: "Travelaider:", breakLine: true },
  { text: "A Blog about Where, Why, and How to Travel", type: "np", grammarName: "Cụm danh từ", viTranslation: "Blog về địa điểm, lý do và cách đi du lịch" },
  { text: "By Ken Ogawa", type: "np", grammarName: "Cụm danh từ", viTranslation: "Tác giả: Ken Ogawa", breakLine: true },

  { text: "Springfield (January 20)—", type: "np", grammarName: "Cụm danh từ", viTranslation: "Springfield (ngày 20 tháng 1)—", breakLine: true },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi" },
  { text: "recently flew", type: "vp", grammarName: "Cụm động từ", viTranslation: "gần đây đã bay" },
  { text: "nonstop (bay thẳng)", type: "adjp", grammarName: "Trạng từ", viTranslation: "bay thẳng" },
  { text: "from Silver City to Centerville", type: "pp", grammarName: "Cụm giới từ", viTranslation: "từ Silver City đến Centerville" },
  { text: "on Ventana Airlines.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với hãng Ventana." },

  { text: "That's right,", type: "other", grammarName: "Liên từ", viTranslation: "Đúng vậy,", breakLine: true },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "said", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã nói" },
  { text: "\"nonstop.\"", type: "adjp", grammarName: "Trạng từ", viTranslation: "\"bay thẳng\"." },

  { text: "Ventana", type: "np", grammarName: "Cụm danh từ", viTranslation: "Ventana", breakLine: true },
  { text: "now offers", type: "vp", grammarName: "Cụm động từ", viTranslation: "hiện cung cấp" },
  { text: "direct flights", type: "np", grammarName: "Cụm danh từ", viTranslation: "các chuyến bay thẳng" },
  { text: "between these two small cities", type: "pp", grammarName: "Cụm giới từ", viTranslation: "giữa hai thành phố nhỏ này" },
  { text: "with no need", type: "pp", grammarName: "Cụm giới từ", viTranslation: "mà không cần" },
  { text: "for travelers", type: "pp", grammarName: "Cụm giới từ", viTranslation: "để du khách" },
  { text: "to change planes", type: "vp", grammarName: "Cụm động từ", viTranslation: "phải đổi máy bay" },
  { text: "at Midwest National Airport,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại Sân bay Quốc gia Midwest," },
  { text: "our only regional hub.", type: "np", grammarName: "Cụm danh từ", viTranslation: "trung tâm khu vực duy nhất của chúng ta." },

  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "surely will not miss", type: "vp", grammarName: "Cụm động từ", viTranslation: "chắc chắn sẽ không nhớ" },
  { text: "hurrying (sự vội vã)", type: "vp", grammarName: "Cụm động từ", viTranslation: "việc chạy vội" },
  { text: "between terminals (nhà ga)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "giữa các nhà ga" },
  { text: "at Midwest", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở Midwest" },
  { text: "through a sea of fellow (người giống mình) passengers.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "qua một biển hành khách đồng hành." },

  { text: "As for the flight itself,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Còn về chuyến bay,", breakLine: true },
  { text: "Ventana's new jets", type: "np", grammarName: "Cụm danh từ", viTranslation: "những chiếc máy bay mới của Ventana" },
  { text: "are", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "a vast (sâu) improvement", type: "np", grammarName: "Cụm danh từ", viTranslation: "một sự cải thiện vượt trội" },
  { text: "over the old ones.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "so với những chiếc cũ." },

  { text: "The possibility of being stuck", type: "np", grammarName: "Cụm danh từ", viTranslation: "Khả năng bị kẹt", breakLine: true },
  { text: "in the middle seat", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở ghế giữa" },
  { text: "is no longer", type: "vp", grammarName: "Cụm động từ", viTranslation: "không còn là" },
  { text: "a concern.", type: "np", grammarName: "Cụm danh từ", viTranslation: "mối bận tâm." },

  { text: "The new aircraft", type: "np", grammarName: "Cụm danh từ", viTranslation: "Máy bay mới", breakLine: true },
  { text: "have only", type: "vp", grammarName: "Cụm động từ", viTranslation: "chỉ có" },
  { text: "two seats", type: "np", grammarName: "Cụm danh từ", viTranslation: "hai ghế" },
  { text: "on each side of the aisle (lối đi),", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở mỗi bên lối đi," },
  { text: "so", type: "other", grammarName: "Liên từ", viTranslation: "nên" },
  { text: "everyone", type: "np", grammarName: "Đại từ", viTranslation: "ai cũng" },
  { text: "gets", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "an aisle or window seat.", type: "np", grammarName: "Cụm danh từ", viTranslation: "ghế cạnh lối đi hoặc cửa sổ." },

  { text: "The seats", type: "np", grammarName: "Cụm danh từ", viTranslation: "Ghế", breakLine: true },
  { text: "are also", type: "vp", grammarName: "Cụm động từ", viTranslation: "cũng" },
  { text: "more comfortable", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "thoải mái hơn" },
  { text: "than most airplane seats.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "so với hầu hết ghế máy bay." },

  { text: "The legroom (chỗ để chân)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Chỗ để chân", breakLine: true },
  { text: "was", type: "vp", grammarName: "Cụm động từ", viTranslation: "hơi" },
  { text: "a little tight", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "chật một chút" },
  { text: "for a person my size,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "đối với người có vóc dáng như tôi," },
  { text: "but", type: "other", grammarName: "Liên từ", viTranslation: "nhưng" },
  { text: "someone of average (trung bình) height", type: "np", grammarName: "Cụm danh từ", viTranslation: "người có chiều cao trung bình" },
  { text: "should have", type: "vp", grammarName: "Cụm động từ", viTranslation: "hẳn sẽ có" },
  { text: "plenty of room", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhiều chỗ" },
  { text: "to stretch out (giãn ra).", type: "vp", grammarName: "Cụm động từ", viTranslation: "để duỗi chân." },
